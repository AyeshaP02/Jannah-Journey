<!--F5.1 Display student progress-->
<!DOCTYPE html>
<html>
<head>

    <title>Jannah Journey - Student Progress</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 20px;
        }
        table {
            width: 70%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background: #4caf50;
            color: white;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .lesson-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
       
        .content {
            line-height: 1.7;
            color: #555;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover { background-color: #45a049; }
        
    </style>
</head>

<body>
    
<h2 style="text-align:center;">⭐ Student Progress</h2>
<table>
    <tr>
        <th>Quiz</th>
        <th>Score</th>
        <th>Date Taken</th>
    </tr>
    {% for row in results %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
    </tr>
    {% endfor %}
    
</table>
<a href="/lessons">← Back to Lessons</a>
</body>
</html>
